version: '3.8'

services:
  # ========================
  # Simülasyon Motoru (WebSocket :8765)
  # ========================
  sim-server:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: sim-server
    container_name: metrobus-sim
    ports:
      - "8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio,websockets; asyncio.get_event_loop().run_until_complete(websockets.connect('ws://localhost:8765'))"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ========================
  # Dashboard (Nginx :80)
  # ========================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrobus-dashboard
    ports:
      - "3000:80"
    depends_on:
      - sim-server
    restart: unless-stopped
