version: '3.8'

services:
  # ========================
  # Simülasyon Motoru (WebSocket :8765)
  # ========================
  sim-server:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: sim-server
    container_name: metrobus-sim
    ports:
      - "8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',8765)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========================
  # IETT Canlı Veri (REST :8888)
  # ========================
  live-server:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: live-server
    container_name: metrobus-live
    ports:
      - "8888:8888"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ========================
  # Dashboard (Nginx :80)
  # ========================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrobus-dashboard
    ports:
      - "3000:80"
    depends_on:
      - sim-server
      - live-server
    restart: unless-stopped
