# ============================================
# Metrobus MAPPO - Faz 2: Gercekci Ortam
# ============================================
# Faz 1'den ogrenilmis modeli yukler,
# gercekci passenger + daha fazla arac ile ince ayar yapar.

# --- Ortam ---
direction: "gidis"
num_buses: 15                # Daha fazla arac
dt: 0.1
episode_length: 36000        # 1 saat (tam senaryo)

# --- Curriculum ---
use_fixed_dwell: false       # Gercekci passenger-based dwell
fixed_dwell_seconds: 15.0    # Kullanilmaz (use_fixed_dwell=false)
randomize_start_hour: true
curriculum_phase: 2
warmstart_checkpoint: "checkpoints/phase1/best_actor.pt"  # Faz 1 sonucu

# --- PPO ---
learning_rate: 0.0001        # Daha dusuk lr (ince ayar)
gamma: 0.99
gae_lambda: 0.95
epsilon: 0.15                # Daha dar kirpma (stabil)
epochs: 10
batch_size: 2048
mini_batch_size: 64
entropy_coef: 0.005          # Daha az kesif (zaten ogrenmis)
value_coef: 0.5
max_grad_norm: 0.5

# --- Ag ---
actor_hidden: 64
critic_hidden: 128
obs_dim: 14
action_dim: 4

# --- Egitim ---
total_iterations: 3000       # Faz 2 daha uzun
checkpoint_interval: 50
eval_interval: 100
log_interval: 10

# --- Reward ---
headway_weight: 10.0
bunching_penalty: -5.0
bunching_warning: -2.0
skip_penalty: -1.0
long_dwell_penalty: -0.5
speed_bonus_weight: 2.0
target_speed_kmh: 40

# --- GPU ---
use_cuda: true

# --- Cikti ---
checkpoint_dir: "checkpoints/phase2"
log_dir: "logs/phase2"
export_dir: "exports"
