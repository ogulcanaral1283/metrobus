# ============================================
# Metrobus MAPPO Egitim Hiperparametreleri
# Beylikduzu -> Halicioglu (31 durak)
# ============================================

# --- Ortam ---
direction: "gidis"
num_buses: 200              # 31 durakta 200 arac
dt: 0.1                    # Zaman adimi (saniye)
episode_length: 36000      # 36000 * 0.1 = 3600 sn = 1 saat
max_stops: 31               # Beylikduzu -> Halicioglu (31 durak)

# --- PPO ---
learning_rate: 0.0003      # Ogrenme hizi (3e-4)
gamma: 0.99                # Indirim faktoru
gae_lambda: 0.95           # GAE lambda
epsilon: 0.2               # PPO kirpma araligi
epochs: 10                 # Her guncelleme icin epoch sayisi (K)
batch_size: 32768            # 512 env x 64 step = GPU doyurma
mini_batch_size: 4096       # GPU doyrma: 32768/4096=8 batch x 10 epoch = 80 iter
entropy_coef: 0.01         # Entropi katsayisi (kesif tesviki)
value_coef: 0.5            # Value loss katsayisi
max_grad_norm: 0.5         # Gradient kirpma normu

# --- Ag ---
actor_hidden: 64           # Actor gizli katman boyutu
critic_hidden: 128         # Critic gizli katman boyutu
obs_dim: 24                # Per-agent gozlem boyutu
action_dim: 4              # Aksiyon sayisi

# --- Egitim ---
total_iterations: 3000     # Daha kisa egitim (kisa segment = hizli convergence)
checkpoint_interval: 100   # Her 100 iterasyonda kaydet
eval_interval: 0           # Devre disi (VecEnv ile eval cok yavas)
log_interval: 5            # Her 5 iterasyonda loglama

# --- Reward agirliklari ---
headway_weight: 10.0       # Headway duzgunlugu odulu
bunching_penalty: -5.0     # Yapisma cezasi (<100m)
bunching_warning: -2.0     # Yapisma uyarisi (<200m)
skip_penalty: -1.0         # Durak atlama cezasi
long_dwell_penalty: -0.5   # Uzun bekleme cezasi (>90sn)
speed_bonus_weight: 2.0    # Hiz bonusu agirligi
target_speed_kmh: 40       # Hedef ortalama hiz (km/h)

# --- GPU ---
use_cuda: true             # GPU kullan (RTX 5070 Ti)
num_envs: 512              # Paralel ortam sayisi (GPU doyurma)

# --- Cikti ---
checkpoint_dir: "checkpoints"
log_dir: "logs"
export_dir: "exports"
